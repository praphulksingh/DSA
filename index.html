<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Message For You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-deep: #9d174d;
            --soft-rose: #fbcfe8;
            --gold-accent: #b45309;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #fff1f2;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Subtle Petal Rain Background */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Initial Proposal Card */
        .card-container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 400px;
            transition: all 0.8s ease;
        }

        .main-card {
            background: white;
            padding: 50px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(157, 23, 77, 0.1);
            border: 1px solid var(--soft-rose);
        }

        .heart-emoji {
            font-size: 55px;
            display: block;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--primary-deep);
            margin-bottom: 15px;
            font-style: italic;
        }

        p.intro-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 35px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            min-height: 50px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 4px;
            border: none;
            font-weight: 400;
            cursor: pointer;
            transition: 0.4s;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-yes {
            background: var(--primary-deep);
            color: white;
        }

        #no-btn {
            background: #f1f5f9;
            color: #94a3b8;
            position: relative;
        }

        /* The Romantic Letter View */
        #letter-view {
            position: fixed;
            inset: 0;
            background: #fff;
            background-image: radial-gradient(#fff5f7 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 50px 25px;
            overflow-y: auto;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .letter-paper {
            max-width: 550px;
            width: 100%;
            text-align: center;
            padding: 20px;
        }

        .letter-heading {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--primary-deep);
            margin-bottom: 30px;
            font-weight: 700;
        }

        .romantic-body {
            font-family: 'Great Vibes', cursive;
            font-size: 1.9rem;
            line-height: 1.5;
            color: #334155;
            white-space: pre-wrap;
            text-align: center;
            margin-bottom: 40px;
        }

        .signature-text {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: var(--gold-accent);
            margin-top: 30px;
        }

        /* Transitions */
        .fade-out { opacity: 0; transform: translateY(20px); pointer-events: none; }
        .active { display: flex !important; opacity: 1 !important; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="card-container" id="proposal-ui">
        <div class="main-card">
            <span class="heart-emoji">💍</span>
            <h1>To My Only One...</h1>
            <h3 class="intro-text">After 5 beautiful years, I have something special for you, Are you ready for it.....</h3>
            
            <div class="btn-group">
                <button class="btn btn-yes" onclick="showLetter()">Yes!</button>
                <button class="btn" id="no-btn">No</button>
            </div>
        </div>
    </div>

    <div id="letter-view">
        <div class="letter-paper">
            <div style="font-size: 30px; margin-bottom: 10px;">🌹</div>
            <h2 class="letter-heading">My Beautiful Valentine</h2>
            <div class="romantic-body" id="letter-text"></div>
            <div class="signature-text">Yours Forever, <br>Praphul</div>
        </div>
    </div>

    <script>
        // 1. Petal/Heart Background
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = init;
        init();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = Math.random() * 6 + 2;
                this.speed = Math.random() * 1 + 0.5;
                this.a = Math.random() * 0.3;
            }
            update() {
                this.y += this.speed;
                if(this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(157, 23, 77, ${this.a})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
            }
        }

        for(let i=0; i<50; i++) particles.push(new Particle());

        function loop() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(loop);
        }
        loop();

        // 2. Letter Content (5 years + details)
        const heartLetter = "My Dearest,\n\nLooking back at these 5 beautiful years together, I am overwhelmed by how lucky I am. \n\nYou are without a doubt, the most beautiful, hot and sexy gilr I have ever known. But beyond that, it is your heart that truly captivates me. \n\nYou have such a good, kind soul and your unwavering loyalty to me has been my greatest strength. Thank you for being my rock, my best friend and my everything.\n\nHere is to many more years of us. I love you more than words can say.";

        function showLetter() {
            document.getElementById('proposal-ui').classList.add('fade-out');
            setTimeout(() => {
                document.getElementById('proposal-ui').style.display = 'none';
                const letterView = document.getElementById('letter-view');
                letterView.classList.add('active');
                typeMessage();
                confetti();
            }, 800);
        }

        function typeMessage() {
            let i = 0;
            const target = document.getElementById('letter-text');
            function type() {
                if (i < heartLetter.length) {
                    target.innerHTML += heartLetter.charAt(i);
                    i++;
                    setTimeout(type, 50);
                }
            }
            type();
        }

        function confetti() {
            for(let i=0; i<100; i++) {
                const c = document.createElement('div');
                c.innerHTML = '❤️';
                c.style.cssText = `position:fixed; left:50%; top:50%; font-size:20px; z-index:200; pointer-events:none;`;
                document.body.appendChild(c);
                const a = Math.random()*Math.PI*2;
                const d = Math.random()*800+200;
                c.animate([{transform:'translate(0,0) scale(1)', opacity:1}, {transform:`translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px) scale(0)`, opacity:0}], {duration:3000, easing:'ease-out'}).onfinish = () => c.remove();
            }
        }

        // Evasive No Button
        const noBtn = document.getElementById('no-btn');
        const escape = () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px'; noBtn.style.top = y + 'px';
        };
        noBtn.addEventListener('mouseover', escape);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); escape(); });
    </script>
</body>
</html>
